[package]
name = "depotpro-ci"
version = "0.1.0"
description = "DepotPro CI — Logiciel de gestion de dépôt de boissons pour la Côte d'Ivoire"
authors = ["DepotPro CI"]
edition = "2021"

[lib]
name = "depotpro_ci_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

# LOT 10 — Port Rust natif (décision n°2, migration 0014).
# Un seul propriétaire du schéma : schema_migrations + SHA-256, appliquées par
# src/db/mod.rs. La fonctionnalité `migrate` de SQLx est volontairement ABSENTE :
# sqlx::migrate! créerait une seconde table _sqlx_migrations incompatible.
[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
scrypt = "0.11"
sha2 = "0.10"
hex = "0.4"
